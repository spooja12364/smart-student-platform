name: smart_student_platform
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: any

  # Firebase
  firebase_core: any
  firebase_auth: any
  firebase_database: any
  cloud_firestore: any
  firebase_storage: any

  # others
  http: any
  google_sign_in: any
  image_picker: any
  record: any
  audioplayers: ^5.2.1
  flutter_linkify: any
  url_launcher: any
  file_picker: ^8.1.4
  firebase_ai: ^3.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.jpg"
  web:
    generate: true
    image_path: "assets/app_logo.jpg"
    background_color: "#hexcode"
    theme_color: "#hexcode"